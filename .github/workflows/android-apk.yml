# Builds the "MTG Sim" Android app from the same code as the website and
# publishes MTG-Sim.apk on the repository's Releases page.
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle the web app into the APK
        run: |
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW"
          mkdir -p "$WWW"
          cp -r index.html css js assets "$WWW"/
          # Invite links made in the app should open your GitHub Pages site.
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO='${{ github.event.repository.name }}'
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            URL="https://$OWNER.github.io/"
          else
            URL="https://$OWNER.github.io/$REPO/"
          fi
          echo "window.MTG_WEB_APP_URL = '$URL';" > "$WWW/js/config.js"
          echo "Invite links will point to $URL"

      - name: Load the signing key (optional repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mtgsim.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/mtgsim.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set, so this APK uses a temporary key. It installs fine, but each new build will need the old app uninstalled first. See README, section Android app."
          fi

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk MTG-Sim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MTG-Sim-apk
          path: MTG-Sim.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MTG Sim for Android
          make_latest: true
          files: MTG-Sim.apk
          body: |
            **MTG Sim for Android**, built from commit ${{ github.sha }} (build ${{ github.run_number }}).

            Download `MTG-Sim.apk` below on your Android phone and open it to install. Android will ask you to allow installing apps from your browser or files app.

            It plays online with the website and with other copies of the app. Everyone should be on the latest version.
